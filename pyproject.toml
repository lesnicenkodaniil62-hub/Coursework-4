[project]
name = "project4"
version = "0.1.0"
description = "Messenger"
authors = [
    {name = "Daniil", email = "lesnicenkodaniil62@gmail.com"}
]
requires-python = "^3.12"

dependencies = [
    "schedule (>=1.2.2,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "psycopg2 (>=2.9.13,<3.0.0)",
    "django (>=6.1.1,<7.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pillow (>=12.3.0,<13.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''

[tool.isort]
# максимальная длина строки
line_length = 119

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "catalog.models.*"
ignore_errors = false

[tool.django-stubs]
django_settings_module = "config.settings"
exclude = "venv"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "django-stubs (>=6.1.0,<7.0.0)",
    "django-stubs-ext (>=6.1.0,<7.0.0)",

]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ipython (>=9.17.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
