{% extends "base.html" %}

{% block title %}Удаление сообщения{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h3>Подтверждение удаления</h3>
                </div>
                <div class="card-body">
                    <p class="lead">Вы уверены, что хотите удалить сообщение <strong>{{ message.subject }}</strong>?</p>
                    <p class="text-danger"><strong>Внимание:</strong> Это действие нельзя отменить!</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'mail_messages:message_list' %}" class="btn btn-secondary">Отмена</a>
                            <button type="submit" class="btn btn-danger">Удалить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
